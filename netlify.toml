[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Single Page Application (SPA) routing redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify Serverless API endpoint routing
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
